server {
    listen 80;
    server_name toyerhair.ca www.toyerhair.ca;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name toyerhair.ca www.toyerhair.ca;

    ssl_certificate /etc/letsencrypt/live/toyerhair.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toyerhair.ca/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}