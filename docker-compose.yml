services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toyer_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - toyer_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: toyer_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - toyer_network

  mongodb:
    image: mongo:6.0
    container_name: toyer_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secretpassword}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - toyer_network

volumes:
  mongo_data:

networks:
  toyer_network:
    driver: bridge
